<!DOCTYPE html>
<html>
<head>
<title>Flappy Bird Final</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin:0;
  overflow:hidden;
  background:#70c5ce;
  font-family:sans-serif;
  touch-action: manipulation;
}

canvas {
  display:block;
  margin:auto;
}

/* UI */
#menu {
  position:absolute;
  width:100%;
  top:25%;
  text-align:center;
  color:white;
}

button {
  padding:12px 25px;
  font-size:18px;
  background:#ffcc00;
  border:none;
  border-radius:8px;
}

#gameover {
  display:none;
  position:absolute;
  width:100%;
  top:30%;
  text-align:center;
  color:white;
}
</style>
</head>

<body>

<div id="menu">
  <h1>Flappy Bird</h1>
  <button id="startBtn">Start</button>
</div>

<div id="gameover">
  <h2>Game Over</h2>
  <p id="scoreText"></p>
  <button onclick="startGame()">Restart</button>
</div>

<canvas id="c" width="400" height="600"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

const menu = document.getElementById("menu");
const gameoverUI = document.getElementById("gameover");
const scoreText = document.getElementById("scoreText");

let gameRunning=false, anim;

// AUDIO (safe)
let audioCtx;
function initAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
}
function play(freq){
  if(!audioCtx) return;
  let o=audioCtx.createOscillator();
  let g=audioCtx.createGain();
  o.frequency.value=freq;
  o.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.1,audioCtx.currentTime);
  o.start(); o.stop(audioCtx.currentTime+0.1);
}

// ASSETS (stable)
const birdImg=new Image();
birdImg.src="https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/yellowbird-midflap.png";

const pipeImg=new Image();
pipeImg.src="https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/pipe-green.png";

const bgImg=new Image();
bgImg.src="https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/background-day.png";

const groundImg=new Image();
groundImg.src="https://raw.githubusercontent.com/samuelcust/flappy-bird-assets/master/sprites/base.png";

// STATE
let bird,pipes,frame,score,high=localStorage.getItem("fbHigh")||0;
let speed=2.6,groundX=0;

// RESET
function reset(){
  bird={x:80,y:250,w:34,h:24,vel:0,rot:0,frame:0};
  pipes=[];
  frame=0;
  score=0;
  groundX=0;
}

// START
document.getElementById("startBtn").onclick=()=>{
  menu.style.display="none";
  initAudio();
  audioCtx.resume();
  startGame();
};

function startGame(){
  gameoverUI.style.display="none";
  if(gameRunning) return;
  gameRunning=true;
  reset();
  loop();
}

// INPUT (only canvas)
c.addEventListener("pointerdown",()=>{
  if(!gameRunning) return;
  bird.vel=-5.2;
  play(600);
});

// DRAW BIRD
function drawBird(){
  bird.frame+=0.2;
  let f=Math.floor(bird.frame)%3;

  if(bird.vel<0) bird.rot=-0.3;
  else{
    bird.rot+=0.03;
    if(bird.rot>1.3) bird.rot=1.3;
  }

  ctx.save();
  ctx.translate(bird.x+bird.w/2,bird.y+bird.h/2);
  ctx.rotate(bird.rot);

  ctx.drawImage(
    birdImg,
    0,0,34,24,
    -bird.w/2,-bird.h/2,
    bird.w,bird.h
  );

  ctx.restore();
}

// LOOP
function loop(){
  if(!gameRunning) return;
  anim=requestAnimationFrame(loop);

  ctx.drawImage(bgImg,0,0,c.width,c.height);

  // physics
  bird.vel+=0.42;
  if(bird.vel>10) bird.vel=10;
  bird.y+=bird.vel;

  drawBird();

  // pipes
  if(frame%90===0){
    let top=Math.random()*250+50;
    pipes.push({x:c.width,top,bottom:top+140,passed:false});
  }

  pipes.forEach(p=>{
    p.x-=speed;

    // top
    ctx.save();
    ctx.translate(p.x+30,p.top);
    ctx.scale(1,-1);
    ctx.drawImage(pipeImg,-30,0,60,320);
    ctx.restore();

    // bottom
    ctx.drawImage(pipeImg,p.x,p.bottom,60,320);

    // collision
    if(
      bird.x < p.x+60 &&
      bird.x+bird.w > p.x &&
      (bird.y < p.top || bird.y+bird.h > p.bottom)
    ) end();

    // score
    if(!p.passed && p.x+60<bird.x){
      score++;
      p.passed=true;
      play(800);
    }
  });

  pipes=pipes.filter(p=>p.x>-60);

  // ground
  groundX-=speed;
  if(groundX<=-c.width) groundX=0;

  ctx.drawImage(groundImg,groundX,c.height-80,c.width,80);
  ctx.drawImage(groundImg,groundX+c.width,c.height-80,c.width,80);

  if(bird.y+bird.h>c.height-80 || bird.y<0) end();

  // score
  ctx.fillStyle="white";
  ctx.font="bold 30px sans-serif";
  ctx.fillText(score,c.width/2-10,50);

  frame++;
}

// END
function end(){
  gameRunning=false;
  cancelAnimationFrame(anim);
  play(200);

  if(score>high){
    high=score;
    localStorage.setItem("fbHigh",high);
  }

  scoreText.innerText="Score: "+score+" | High: "+high;
  gameoverUI.style.display="block";
}
</script>

</body>

<style>
#wm {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  
  font-size: 12px;
  font-family: Arial, sans-serif;
  color: white;
  opacity: 0.35;

  pointer-events: none; /* 🔑 no interference */
  user-select: none;

  z-index: 9999;
}
</style>
  </html>
